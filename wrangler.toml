name = "mycf"
main = "_worker.js"
compatibility_date = "2024-09-23"

# KV 命名空间：存储账号信息(accounts) 与 TG 配置(tg_config)、告警状态(tg_quota_alert)
# 先在 Cloudflare 控制台创建 KV 命名空间，把它的 ID 填到下面
kv_namespaces = [
  { binding = "CF_ACCOUNTS_KV", id = "在此填写你的_KV_namespace_id" }
]

# 可选：直接写死 TG 凭据（也可在面板「设置」里配置，二选一）
# 不填则使用面板保存的 tg_config
# [vars]
# TG_BOT_TOKEN = ""
# TG_CHAT_ID = ""

# 定时触发器（免费版每账号最多 5 个，这里只用 1 个，其余 4 个留给以后扩展）
# 单个每小时触发器，在 worker 内按 UTC 小时分支：
#   - UTC 23 点：每日巡检(历史/存储/资产/证书/心跳) + 当日请求日报(北京 07:xx)
#   - 03/07/11/15/19 点：探活 + WAF + 配额告警 + 心跳校验
[triggers]
crons = [
  "23 * * * *"
]
